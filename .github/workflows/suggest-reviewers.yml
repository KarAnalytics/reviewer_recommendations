name: Suggest reviewers

# Manually triggered from the Actions tab -- "Run workflow". Anyone with
# write access to this repo can run it with their OWN LLM API key (never
# stored anywhere -- masked in logs, used only for this run). Requires the
# repo-level GOOGLE_SHEET_ID variable and GOOGLE_SERVICE_ACCOUNT_JSON
# secret to be set once (see reviewer_tools/README.md).
on:
  workflow_dispatch:
    inputs:
      llm_provider:
        description: "LLM provider (bring your own key below)"
        type: choice
        options: [anthropic, openai, groq, openrouter, ollama_cloud]
        default: anthropic
        required: true
      llm_api_key:
        description: "Your API key for that provider (masked in logs, never stored)"
        type: string
        required: true
      top_n:
        description: "How many reviewers to suggest per paper"
        type: string
        default: "5"
      max_per_reviewer:
        description: "Cap on how many papers one reviewer can be suggested for (0 = no cap)"
        type: string
        default: "5"
      force:
        description: "Recompute every paper (not just blank AISuggestedReviewers cells)"
        type: boolean
        default: false
      limit:
        description: "Only process this many papers (blank = no limit; handy for a test run)"
        type: string
        default: ""

jobs:
  suggest:
    runs-on: ubuntu-latest
    steps:
      - name: Mask the API key
        run: echo "::add-mask::${{ inputs.llm_api_key }}"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run suggest_reviewers.py
        env:
          LLM_PROVIDER: ${{ inputs.llm_provider }}
          LLM_API_KEY: ${{ inputs.llm_api_key }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CONFERENCE_NAME: ${{ vars.CONFERENCE_NAME }}
          CONFERENCE_FIELD: ${{ vars.CONFERENCE_FIELD }}
        run: |
          ARGS=(--top-n "${{ inputs.top_n }}" --max-per-reviewer "${{ inputs.max_per_reviewer }}")
          if [ "${{ inputs.force }}" = "true" ]; then ARGS+=(--force); fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS+=(--limit "${{ inputs.limit }}"); fi
          python suggest_reviewers.py "${ARGS[@]}"

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suggest-reviewers-log
          path: logs/
          if-no-files-found: ignore
