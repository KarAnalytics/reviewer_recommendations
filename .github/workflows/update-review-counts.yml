name: Update review counts

# Manually triggered from the Actions tab. (Re)installs the live
# No_reviews_assigned formula on ReviewerList -- needed once (first-time
# setup) or after adding new rows to ReviewerList. No LLM/API key needed
# for this one, just Google Sheets access.
on:
  workflow_dispatch: {}

jobs:
  update-counts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run update_review_counts.py
        env:
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python update_review_counts.py

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-review-counts-log
          path: logs/
          if-no-files-found: ignore
