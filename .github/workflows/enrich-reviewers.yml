name: Enrich reviewers

# Manually triggered from the Actions tab -- "Run workflow". Fills in
# Position/Interests/Website for reviewers who don't have them yet.
# 'ollama_cloud' needs an Ollama API key (its own field below) for the web
# search step regardless of which provider does the summarizing;
# 'anthropic'/'openai' search the web themselves and only need the one key.
on:
  workflow_dispatch:
    inputs:
      llm_provider:
        description: "LLM provider (bring your own key below)"
        type: choice
        options: [anthropic, openai, ollama_cloud]
        default: anthropic
        required: true
      llm_api_key:
        description: "Your API key for that provider (masked in logs, never stored)"
        type: string
        required: true
      ollama_api_key:
        description: "Ollama API key -- REQUIRED if llm_provider is ollama_cloud, ignored otherwise (get one at ollama.com/settings/keys)"
        type: string
        default: ""
      limit:
        description: "Only process this many reviewers (blank = no limit; handy for a test run)"
        type: string
        default: ""
      force:
        description: "Re-look-up everyone, even rows already filled in"
        type: boolean
        default: false
      only:
        description: "Comma-separated exact name(s) to redo, ignoring the already-filled-in check (blank = normal mode)"
        type: string
        default: ""

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Mask the API keys
        run: |
          echo "::add-mask::${{ inputs.llm_api_key }}"
          echo "::add-mask::${{ inputs.ollama_api_key }}"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run enrich_reviewers.py
        env:
          LLM_PROVIDER: ${{ inputs.llm_provider }}
          LLM_API_KEY: ${{ inputs.llm_api_key }}
          OLLAMA_API_KEY: ${{ inputs.ollama_api_key }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CONFERENCE_NAME: ${{ vars.CONFERENCE_NAME }}
          CONFERENCE_FIELD: ${{ vars.CONFERENCE_FIELD }}
        run: |
          ARGS=()
          if [ -n "${{ inputs.limit }}" ]; then ARGS+=(--limit "${{ inputs.limit }}"); fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS+=(--force); fi
          if [ -n "${{ inputs.only }}" ]; then ARGS+=(--only "${{ inputs.only }}"); fi
          python enrich_reviewers.py "${ARGS[@]}"

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enrich-reviewers-log
          path: logs/
          if-no-files-found: ignore
